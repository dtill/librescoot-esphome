  # Raw response notification feed: shows the last response line, and drives the typed
  # parsers + the aggregated "Command last response" log below.
  - platform: ble_client
    ble_client_id: my_ble_device
    name: "Command response"
    id: cmd_response
    service_uuid: "9a590400-6e67-5d0d-aab9-ad9126b66f91"
    characteristic_uuid: "9a590402-6e67-5d0d-aab9-ad9126b66f91"
    notify: true
    update_interval: never
    icon: "mdi:message-reply-text"
    entity_category: diagnostic
    on_value:
      then:
        - lambda: |-
            // Build a clean single-line string (strip nulls + control chars).
            std::string line;
            for (char c : x) {
              if (c == 0) break;
              if ((uint8_t)c >= 0x20) line += c;
            }
            if (line.empty()) return;

            // Typed responses — parsed always, so on-connect queries and button/text
            // commands all update the same entities regardless of the collection window.
            if (line.rfind("status:version:dbc:", 0) == 0)
              id(dbc_version_txt).publish_state(line.substr(19));
            else if (line.rfind("keycard:count:", 0) == 0)
              id(keycard_count).publish_state(line.substr(14));
            else if (line.rfind("status:maps-available:", 0) == 0)
              id(maps_available).publish_state(line.find(":true") != std::string::npos);
            else if (line.rfind("status:navigation-available:", 0) == 0)
              id(nav_available).publish_state(line.find(":true") != std::string::npos);
            else if (line.rfind("get:cellular.apn:", 0) == 0)
              id(apn_input).publish_state(line.substr(17));  // prefill only; no write
            else if (line.rfind("get:pm.scheduled-hibernate-enabled:", 0) == 0)
              id(pm_sched_hib_enabled).publish_state(line.find(":true") != std::string::npos);
            else if (line.rfind("get:pm.scheduled-hibernate-cron:", 0) == 0)
              id(pm_sched_hib_cron).publish_state(line.substr(32));
            else if (line.rfind("get:pm.scheduled-hibernate-duration:", 0) == 0)
              id(pm_sched_hib_duration).publish_state(line.substr(36));

            // Log aggregation + terminator detection only while a script is collecting.
            if (!id(cmd_response_collecting)) return;
            auto &log = id(cmd_response_log);
            if (!log.empty()) log += "\n";
            log += line;
            // HA rejects text sensor states > 255 chars (cap:list etc. exceed this);
            // truncate for the entity, full text is in the log line above.
            std::string shown = log.size() > 255 ? (log.substr(0, 249) + "...") : log;
            id(cmd_response_log_txt).publish_state(shown);

            // A "<prefix>:count:<n>" header means n more lines follow; otherwise the
            // first standalone line completes the response.
            size_t cpos = line.find(":count:");
            if (cpos != std::string::npos) {
              id(cmd_expected_lines) = atoi(line.c_str() + cpos + 7);
              id(cmd_lines_seen) = 0;
            } else if (id(cmd_expected_lines) > 0) {
              id(cmd_lines_seen) += 1;
              if (id(cmd_lines_seen) >= id(cmd_expected_lines)) id(cmd_response_done) = true;
            } else {
              id(cmd_response_done) = true;
            }

  - platform: template
    name: "Command last response"
    id: cmd_response_log_txt
    icon: "mdi:script-text-outline"
    entity_category: diagnostic


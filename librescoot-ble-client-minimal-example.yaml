  # Query the DBC firmware version (read-only extended command).
  - platform: template
    name: "DBC Version query"
    id: query_dbc_version
    icon: "mdi:help-box-outline"
    entity_category: diagnostic
    on_press:
      - script.execute:
          id: run_extended_command
          cmd: "status:version:dbc"

  # --- OTA diagnostics (visibility into the OTA service; no install is triggered) ---
  # STATUS_REQ [0x05] → OTA_CONTROL; answered with an INSTALL_PROGRESS on OTA_STATUS.
  - platform: template
    name: "OTA Status Request"
    id: ota_status_req
    icon: "mdi:progress-question"
    entity_category: diagnostic
    on_press:
      - ble_client.ble_write:

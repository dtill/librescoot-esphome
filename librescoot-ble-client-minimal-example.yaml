          characteristic_uuid: "9a590502-6e67-5d0d-aab9-ad9126b66f91"
          value: [0x05]

  # ABORT [0x04][0x00] (user cancel) → OTA_CONTROL. Keeps any partial for resume.
  - platform: template
    name: "OTA Abort"
    id: ota_abort
    icon: "mdi:cancel"
    entity_category: diagnostic
    on_press:
      - ble_client.ble_write:
          id: my_ble_device
          service_uuid: "9a590500-6e67-5d0d-aab9-ad9126b66f91"
          characteristic_uuid: "9a590502-6e67-5d0d-aab9-ad9126b66f91"
          value: [0x04, 0x00]

  # Set the scooter clock to the ESP's current (SNTP) time via "time:set <unix>".
  - platform: template
    name: "System Time sync with ESP"
    id: set_system_time
    icon: "mdi:clock-check"
    entity_category: diagnostic
    on_press:
      - if:
          condition:
            lambda: 'return id(sntp_time).now().is_valid();'
          then:
            - script.execute:
                id: run_extended_command
                cmd: !lambda 'return std::string("time:set ") + to_string((long) id(sntp_time).now().timestamp);'

  # Reboot the ESP itself (not the scooter).
  - platform: restart
    name: "Restart ESPHome Device"
    entity_category: config

  # --- Extended-command action buttons ---
  - platform: template
    name: "Alarm Start"
    id: alarm_start
    icon: "mdi:alarm-light-outline"
    on_press:
      - script.execute: {id: run_extended_command, cmd: "alarm:start"}

  - platform: template

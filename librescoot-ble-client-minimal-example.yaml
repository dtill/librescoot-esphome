# Handlebar lock. Optimistic so pressing lock/unlock updates the UI immediately; the
# real state is then reconciled from the operating state (9a590021) — only
# "ready-to-drive" is UNLOCKED, every other value (incl. unknown) is LOCKED, so the
# entity never implies the scooter is open. Nothing is written unless invoked.
lock:
  - platform: template
    name: "Scooter Lock"
    id: scooter_lock
    icon: "mdi:lock-smart"
    optimistic: true
    lock_action:
      - lambda: 'id(lock_reflect_suppress_until) = millis() + 5000;'
      - ble_client.ble_write:
          id: my_ble_device
          service_uuid: "9a590000-6e67-5d0d-aab9-ad9126b66f91"
          characteristic_uuid: "9a590001-6e67-5d0d-aab9-ad9126b66f91"
          value: !lambda |-
            std::string c = "scooter:state lock";
            return std::vector<uint8_t>(c.begin(), c.end());
    unlock_action:
      - lambda: 'id(lock_reflect_suppress_until) = millis() + 5000;'
      - ble_client.ble_write:
          id: my_ble_device
          service_uuid: "9a590000-6e67-5d0d-aab9-ad9126b66f91"
          characteristic_uuid: "9a590001-6e67-5d0d-aab9-ad9126b66f91"
          value: !lambda |-
            std::string c = "scooter:state unlock";
            return std::vector<uint8_t>(c.begin(), c.end());


select:
  # BLE link mode:
  #   disconnect = client off AND scanner stopped (radio quiet; full handoff to the phone)
  #   scan       = client off but scanner running (no MAC / presence detectable)
  #   auto       = keep connected (release by choosing scan/disconnect)
  #   always     = keep connected
  # Any OTA in progress pins the link up regardless of the selected mode.
  - platform: template
    name: "BLE Link Mode"
    id: link_mode
    icon: "mdi:bluetooth-connect"
    entity_category: diagnostic
    optimistic: false
    options: ["disconnect", "scan", "auto", "always"]
    initial_option: "auto"
    set_action:
      - lambda: |-
          id(link_mode_str) = x;
          id(link_mode).publish_state(x);
      - script.execute: apply_link_state

  - platform: template
    name: "Blinker"
    id: blinker
    icon: "mdi:car-light-high"
    options: ["off", "left", "right", "both"]
    optimistic: true
    set_action:
      - ble_client.ble_write:
          id: my_ble_device
          service_uuid: "9a590000-6e67-5d0d-aab9-ad9126b66f91"
          characteristic_uuid: "9a590001-6e67-5d0d-aab9-ad9126b66f91"
          value: !lambda |-
            std::string cmd = "scooter:blinker " + x;
            return std::vector<uint8_t>(cmd.begin(), cmd.end());

  # USB mode. No dedicated characteristic — switched via the Extended Command channel
  # (usb:ums / usb:normal); the selected option is not applied optimistically but
  # reflected from the actual USB Mass Storage status (9a59a045).
  - platform: template
    name: "USB Mode"
    id: usb_mode
    icon: "mdi:usb-flash-drive"
    entity_category: diagnostic
    optimistic: false
    options: ["Normal", "Mass Storage"]
    set_action:
      - script.execute:
          id: run_extended_command
          cmd: !lambda 'return x == "Mass Storage" ? std::string("usb:ums") : std::string("usb:normal");'

  # OTA update channel. No readback exists, so the initial "undefined" is a placeholder;
  # picking a real channel sends config:update-channel <value>.
  - platform: template
    name: "OTA channel"
    id: update_channel
    icon: "mdi:update"
    entity_category: diagnostic
    optimistic: true
    options: ["undefined", "stable", "testing", "nightly"]
    initial_option: "undefined"
    set_action:
      - if:
          condition:
            lambda: 'return x != "undefined";'
          then:
            - script.execute:
                id: run_extended_command
                cmd: !lambda 'return std::string("config:update-channel ") + x;'

switch:
  # Alarm system enable/disable. No alarm-status query exists, so state is optimistic
  # (last command this session); restore_mode DISABLED means nothing is written at boot.
  - platform: template
    name: "Alarm Enabled"
    id: alarm_enabled
    icon: "mdi:alarm-light"
    optimistic: true
    restore_mode: DISABLED
    turn_on_action:
      - script.execute: {id: run_extended_command, cmd: "alarm:enable"}
    turn_off_action:
      - script.execute: {id: run_extended_command, cmd: "alarm:disable"}

  # Alarm arm/disarm (runtime, independent of the enabled setting).
  - platform: template
    name: "Alarm Armed"
    id: alarm_armed
    icon: "mdi:shield-lock"
    optimistic: true
    restore_mode: DISABLED
    turn_on_action:
      - script.execute: {id: run_extended_command, cmd: "alarm:arm"}
    turn_off_action:
      - script.execute: {id: run_extended_command, cmd: "alarm:disarm"}

  # Scheduled hibernation on/off (pm.scheduled-hibernate-enabled). State reflected from
  # get:pm.scheduled-hibernate-enabled on connect / refresh; optimistic for instant UI.
  - platform: template
    name: "PM Scheduled Hibernation Enabled"
    id: pm_sched_hib_enabled
    icon: "mdi:calendar-clock"
    entity_category: config
    optimistic: true
    restore_mode: DISABLED
    turn_on_action:
      - script.execute: {id: run_extended_command, cmd: "set:pm.scheduled-hibernate-enabled true"}
    turn_off_action:
      - script.execute: {id: run_extended_command, cmd: "set:pm.scheduled-hibernate-enabled false"}


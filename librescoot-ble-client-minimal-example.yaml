  - platform: template
    name: "Navigation Clear"
    id: nav_clear
    icon: "mdi:map-marker-off"
    entity_category: diagnostic
    on_press:
      - script.execute: {id: run_extended_command, cmd: "nav:clear"}

  - platform: template
    name: "Cancel Hibernate"
    id: pm_hibernate_cancel
    icon: "mdi:power-sleep"
    on_press:
      - script.execute: {id: run_extended_command, cmd: "pm:hibernate-cancel"}

  # Force an immediate re-read of the polled characteristics and re-fetch all the
  # query-backed entities (versions, keycard count, maps/nav, APN, PM settings).
  - platform: template
    name: "A-Refresh Sensor States"
    id: refresh_states
    icon: "mdi:refresh"
    entity_category: diagnostic
    on_press:
      - script.execute: fetch_queries
      - component.update: bat1_soc
      - component.update: bat2_soc
      - component.update: bat1_cycles
      - component.update: bat2_cycles
      - component.update: aux_voltage
      - component.update: aux_level
      - component.update: cbb_level
      - component.update: cbb_remaining
      - component.update: cbb_full
      - component.update: cbb_cell
      - component.update: odometer
      - component.update: power_mux

text:
  - platform: template
    name: "Command"
    id: extended_command
    icon: "mdi:console"
    entity_category: diagnostic
    optimistic: true
    initial_value: "cap:list"
    min_length: 0
    max_length: 128
    mode: text
    set_action:
      - script.execute:
          id: run_extended_command
          cmd: !lambda 'return x;'

  # Set a navigation destination: "lat,lon" or "lat,lon,name".
  - platform: template
    name: "Navigation Set to"
    id: nav_dest_input
    icon: "mdi:map-marker-plus"
    entity_category: config
    optimistic: true
    min_length: 0
    max_length: 128
    mode: text
    set_action:
      - script.execute:
          id: run_extended_command
          cmd: !lambda 'return std::string("nav:dest ") + x;'

  # Cellular APN. Prefilled from get:cellular.apn on connect; editing sends
  # set:cellular.apn <value>. First proof of the get:/set: config interface.
  - platform: template
    name: "Cellular APN"
    id: apn_input
    icon: "mdi:sim"
    entity_category: config
    optimistic: true
    min_length: 0
    max_length: 64
    mode: text
    set_action:
      - script.execute:
          id: run_extended_command
          cmd: !lambda 'return std::string("set:cellular.apn ") + x;'

  # Scheduled hibernation cron (5-field, e.g. "* */6 * * *"; empty disables).
  - platform: template
    name: "PM Scheduled Hibernation Cron"
    id: pm_sched_hib_cron
    icon: "mdi:calendar-clock"
    entity_category: config
    optimistic: true
    min_length: 0
    max_length: 64
    mode: text
    set_action:
      - script.execute:
          id: run_extended_command
          cmd: !lambda 'return std::string("set:pm.scheduled-hibernate-cron ") + x;'

  # Scheduled hibernation duration (Go syntax, e.g. "5h30m").
  - platform: template
    name: "PM Scheduled Hibernation Duration"
    id: pm_sched_hib_duration
    icon: "mdi:timer-sand"
    entity_category: config
    optimistic: true
    min_length: 0
    max_length: 32
    mode: text
    set_action:
      - script.execute:
          id: run_extended_command
          cmd: !lambda 'return std::string("set:pm.scheduled-hibernate-duration ") + x;'

  # Set the scooter clock from an explicit UTC timestamp "2026-07-26T18:45:30Z".
  # Parsed to a Unix epoch and sent via time:set.
  - platform: template
    name: "System Time Set UTC ISO-8601"
    id: system_time_set_iso
    icon: "mdi:clock-edit-outline"
    entity_category: diagnostic
    optimistic: true
    min_length: 0
    max_length: 32
    mode: text
    set_action:
      - lambda: |-
          int y, mo, d, h, mi, se;
          if (sscanf(x.c_str(), "%d-%d-%dT%d:%d:%dZ", &y, &mo, &d, &h, &mi, &se) != 6) {
            ESP_LOGW("time", "SystemTime Set: expected 2026-07-26T18:45:30Z, got '%s'", x.c_str());
            return;
          }
          // civil date (UTC) -> days since 1970 (Howard Hinnant's algorithm)
          int yy = y - (mo <= 2);
          long era = (yy >= 0 ? yy : yy - 399) / 400;
          unsigned yoe = (unsigned)(yy - era * 400);
          unsigned doy = (153 * (mo + (mo > 2 ? -3 : 9)) + 2) / 5 + d - 1;
          unsigned doe = yoe * 365 + yoe / 4 - yoe / 100 + doy;
          long days = era * 146097L + (long)doe - 719468;
          long epoch = days * 86400L + h * 3600L + mi * 60L + se;
          id(run_extended_command)->execute(std::string("time:set ") + to_string(epoch));
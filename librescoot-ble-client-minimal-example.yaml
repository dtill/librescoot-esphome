# Unu-Scooter Pro BLE -Client for Librescoot FW and nRF v2.0.0-ls
#
# uses ESPHome BLE Client (https://esphome.io/components/ble_client/) and exposes available characteristics
# as sensors.
# More info at LibreScoot Tech Reference: (https://reference.librescoot.org/bluetooth/)
#
# to set all the passwords, mac addr and credentials in this example add theses to your secrets.yaml file:
# see (https://esphome.io/guides/yaml/#secrets-and-the-secretsyaml-file)
#
# librescoot_api_key: "xxx"
# librescoot_ota_pw: "xxx"
# librescoot_wifi_ssid:"xxx"
# librescoot_wifi_pw: "xxx"
# librescoot_fallback_ap_pw: "xxxxxxxx"               #should be 8 digits
# librescoot_webserver_basic_auth_user: "xxx"
# librescoot_webserver_basic_auth_pw: "xxx"
# librescoot_nrf_ble_mac_addr: "XX:XX:XX:XX:XX:XX"    # your scooters ble MAC addr
#
# To delete bond in scooter nRF first use "BLE Remove Bond"-button (you have to enable it first in HA - disabled by default).
# To delete bond in ESP chip, use erase-flash from estool: 'esptool --port /dev/usbserialxxx erase-flash'

substitutions:
  device_name: "librescoot-nrf-ble-client"
  device_friendly_name: "Librescoot-nRF-BLE-Client"
  device_id_name: "librescoot_nrf_ble_client"

esphome:
  name: $device_name
  friendly_name: $device_friendly_name
  comment: "Connects to the LibreScoot / unu Scooter Pro firmware through the nRF BLE chip and controls the most common phone-app functions and a little more."
  build_path: "../config/esphome/build/${device_name}_build"
  on_boot:
    # Show the lock as LOCKED until the real operating state has been read, so it
    # never defaults to an "unlocked" appearance. Publishes state only; writes nothing.
    - priority: -100
      then:
        - lambda: 'id(scooter_lock).publish_state(lock::LOCK_STATE_LOCKED);'
        # Give the command-response entities a value so they aren't greyed before the
        # first command is run.
        - lambda: |-
            id(cmd_response_log_txt).publish_state("(no command run yet)");
            id(cmd_response).publish_state("(no command run yet)");
        # Reflect the restored Link Mode in the select, then apply it (connect for
        # auto/always, stay off for scan/disconnect/no-MAC).
        - lambda: 'id(link_mode).publish_state(id(link_mode_str));'
        - script.execute: apply_link_state

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true


# Enable Home Assistant API
api:
  reboot_timeout: 5min
  encryption:
    key: !secret librescoot_api_key
  actions:
    - action: passkey_reply
      variables:
        pin: int
      then:
        - logger.log:
            format: "Sende PIN %06ld an das Gerät..."
            args: [ pin ]
        - ble_client.passkey_reply:
            id: my_ble_device
            passkey: !lambda return pin;

ota:
  platform: esphome
  password: !secret librescoot_ota_pw

wifi:
  use_address: 192.168.178.171
  ssid: !secret librescoot_wifi_ssid
  password: !secret librescoot_wifi_pw
  reboot_timeout: 1min
  min_auth_mode: WPA2

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: ${device_name}-ap
    password: !secret librescoot_fallback_ap_pw

captive_portal:

web_server:
  local: true # no external content from internet. All serverd from flash
  version: 3 # 1 (lightweight), 2 (modern) or 3 (advanced sensor grouping sliders etc)
  port: 80
  auth:
    username: !secret librescoot_webserver_basic_auth_user
    password: !secret librescoot_webserver_basic_auth_pw
    type: digest


logger:
  baud_rate: 0  # disable logging over UART
  logs:
    # These log "Cannot poll, not connected" on every poll while the link is down
    # (expected in scan/disconnect link modes) — silence that noise.
    ble_sensor: ERROR
    ble_text_sensor: ERROR

globals:
  - id: cmd_response_log
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: cmd_response_collecting
    type: bool
    restore_value: no
    initial_value: 'false'
  # Track completion of an extended-command response: a reply is complete when a
  # terminator line is seen (":ok", ":error:", a single standalone line, or a
  # "<prefix>:count:<n>" header followed by n lines) rather than after a fixed wait.
  - id: cmd_response_done
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: cmd_expected_lines
    type: int
    restore_value: no
    initial_value: '0'
  - id: cmd_lines_seen
    type: int
    restore_value: no
    initial_value: '0'
  # After a lock/unlock command, ignore the 9a590021 reflection until this millis()
  # deadline so the optimistic state holds while the scooter transitions (no flicker).
  - id: lock_reflect_suppress_until
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # True while an OTA transfer/install is in progress; forces the BLE link to stay up.
  - id: ota_active
    type: bool
    restore_value: no
    initial_value: 'false'
  # Selected BLE link mode (disconnect / scan / auto / always); persisted across reboots.
  - id: link_mode_str
    type: std::string
    restore_value: yes
    initial_value: '"auto"'

# Extended-command engine: write the command to the Command characteristic, then
# wait for a recognised terminator (set by the Response handler) with a 20 s timeout
# fallback. mode: single drops overlapping requests so replies never interleave.
script:
  # Enable/disable the BLE client according to Link Mode and OTA state:
  # scan (or no MAC configured) → disconnect and stay off; auto/always → keep connected;
  # any OTA in progress forces the link up regardless of the selected mode.
  - id: apply_link_state
    then:
      - lambda: |-
          // auto/always (and any OTA in progress) keep the client enabled; scan/disconnect
          // or a missing MAC disable it. The scanner is always left running so auto_connect
          // re-establishes the link (with full service discovery) on its own.
          std::string mac = "${ble_mac}";
          bool has_mac = (mac != "00:00:00:00:00:00");
          std::string mode = id(link_mode_str);
          bool want = has_mac && (id(ota_active) || (mode != "scan" && mode != "disconnect"));
          id(my_ble_device)->set_enabled(want);

  # Send a single extended-command query (write to the Command characteristic).
  - id: send_ext_query
    parameters:
      q: string
    then:
      - ble_client.ble_write:
          id: my_ble_device
          service_uuid: "9a590400-6e67-5d0d-aab9-ad9126b66f91"
          characteristic_uuid: "9a590401-6e67-5d0d-aab9-ad9126b66f91"
          value: !lambda |-
            std::string c = q;
            c.push_back('\0');
            return std::vector<uint8_t>(c.begin(), c.end());

  # Fetch every query-backed entity (external commands) once. Called on connect and by
  # the "Refresh Sensor States" button. Spaced so single-line replies do not overlap.
  - id: fetch_queries
    mode: single
    then:
      - component.update: mdb_sw_version
      - component.update: nrf_version
      - script.execute: {id: send_ext_query, q: "keycard:count"}
      - delay: 1500ms
      - script.execute: {id: send_ext_query, q: "status:version:dbc"}
      - delay: 1500ms
      - script.execute: {id: send_ext_query, q: "status:maps-available"}
      - delay: 1500ms
      - script.execute: {id: send_ext_query, q: "status:navigation-available"}
      - delay: 1500ms
      - script.execute: {id: send_ext_query, q: "get:cellular.apn"}
      - delay: 1500ms
      - script.execute: {id: send_ext_query, q: "get:pm.scheduled-hibernate-enabled"}
      - delay: 1500ms
      - script.execute: {id: send_ext_query, q: "get:pm.scheduled-hibernate-cron"}
      - delay: 1500ms
      - script.execute: {id: send_ext_query, q: "get:pm.scheduled-hibernate-duration"}

  - id: run_extended_command
    mode: single
    parameters:
      cmd: string
    then:
      - lambda: |-
          id(cmd_response_log) = "";
          id(cmd_response_collecting) = true;
          id(cmd_response_done) = false;
          id(cmd_expected_lines) = 0;
          id(cmd_lines_seen) = 0;
          ESP_LOGI("cmd", "TX ext cmd: %s", cmd.c_str());
      - ble_client.ble_write:
          id: my_ble_device
          service_uuid: "9a590400-6e67-5d0d-aab9-ad9126b66f91"
          characteristic_uuid: "9a590401-6e67-5d0d-aab9-ad9126b66f91"
          value: !lambda |-
            std::string c = cmd;
            c.push_back('\0');
            return std::vector<uint8_t>(c.begin(), c.end());
      - wait_until:
          condition:
            lambda: 'return id(cmd_response_done);'
          timeout: 20s
      - lambda: |-
          id(cmd_response_collecting) = false;
          ESP_LOGI("cmd", "ext cmd done (%d lines):\n%s", id(cmd_lines_seen), id(cmd_response_log).c_str());

esp32_ble:
  io_capability: keyboard_only

esp32_ble_tracker:
  id: ble_tracker

# Time source for the "Set System Time" button (writes a Unix timestamp to 9a59a043).
time:
  - platform: sntp
    id: sntp_time
    servers:
      - 192.168.178.1      # local router
      - pool.ntp.org       # public fallback

ble_client:
  - mac_address: ${ble_mac}
    id: my_ble_device
    auto_connect: true
    on_connect:
      then:
        - logger.log: "Scooter Connected! Characteristics will be listed now..."
        # Fetch all query-backed entities once per connection (read-only queries).
        - delay: 3s
        - script.execute: fetch_queries
    on_disconnect:
      then:
        - logger.log: "Connection lost."
        # Mark all scooter-derived entities unknown so nothing shows a stale value while
        # the link is down. Keep the ESP's own state entities (link/presence/version).
        - lambda: |-
            for (auto *s : App.get_sensors()) s->publish_state(NAN);
            for (auto *b : App.get_binary_sensors()) {
              if (b == id(ble_connection_bs) || b == id(ble_presence_bs)) continue;
              b->invalidate_state();
            }
            for (auto *t : App.get_text_sensors()) {
              if (t == id(esphome_version_ts)) continue;
              t->publish_state("unknown");
            }
    on_passkey_request:
      then:
        - logger.log: "!!! PIN REQUIRED !!!"
        - logger.log: "Please go to Home Assistant -> Developer Tools -> Actions"
        - logger.log: "Select 'esphome.your_node_name_passkey_reply' and enter the PIN."
    on_passkey_notification:
      then:
        - logger.log:
            format: "The device displays this passkey: %06lu"
            args: [ passkey ]

sensor:
  # --- System Info (0x9a59a000) ---
  # Reset Reason (9a59a021) and Reset Count (9a59a022) are nRF-internal and not
  # exposed over BLE — reading them returns no value. Left commented as a reminder.
  # - platform: ble_client
  #   ble_client_id: my_ble_device
  #   type: characteristic
  #   name: "Reset Count"
  #   service_uuid: "9a59a000-6e67-5d0d-aab9-ad9126b66f91"
  #   characteristic_uuid: "9a59a022-6e67-5d0d-aab9-ad9126b66f91"
  #   icon: "mdi:counter"
  #   entity_category: diagnostic
  #   accuracy_decimals: 0

  # --- Main Battery Service (0x9a5900e0) ---
  - platform: ble_client
    ble_client_id: my_ble_device
    type: characteristic
    name: "Battery 1 SoC"
    service_uuid: "9a5900e0-6e67-5d0d-aab9-ad9126b66f91"
    characteristic_uuid: "9a5900e9-6e67-5d0d-aab9-ad9126b66f91"
    id: bat1_soc
    unit_of_measurement: "%"
    icon: "mdi:battery"
    state_class: measurement
    device_class: battery
    accuracy_decimals: 0
    # Report unknown while the battery is unplugged (stale value otherwise).
    filters:
      - lambda: 'return id(battery_1_present).state ? x : NAN;'

  - platform: ble_client
    ble_client_id: my_ble_device
    type: characteristic
    name: "Battery 1 Cycles"
    service_uuid: "9a5900e0-6e67-5d0d-aab9-ad9126b66f91"
    characteristic_uuid: "9a5900e6-6e67-5d0d-aab9-ad9126b66f91"
    id: bat1_cycles
    icon: "mdi:battery-sync"
    entity_category: diagnostic
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 600s
    filters:
      - lambda: 'return id(battery_1_present).state ? x : NAN;'

  # Battery 1 Present → internal, exposed as binary_sensor
  - platform: ble_client
    ble_client_id: my_ble_device
    type: characteristic
    id: battery_1_present_raw
    internal: true
    name: "Battery 1 Present"
    service_uuid: "9a5900e0-6e67-5d0d-aab9-ad9126b66f91"
    characteristic_uuid: "9a5900e3-6e67-5d0d-aab9-ad9126b66f91"
    icon: "mdi:battery-check"
    entity_category: diagnostic
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) return;   // ignore the NaN published on disconnect
            id(battery_1_present).publish_state(x != 0);

  - platform: ble_client
    ble_client_id: my_ble_device
    type: characteristic
    name: "Battery 2 SoC"
    service_uuid: "9a5900e0-6e67-5d0d-aab9-ad9126b66f91"
    characteristic_uuid: "9a5900f5-6e67-5d0d-aab9-ad9126b66f91"
    id: bat2_soc
    unit_of_measurement: "%"
    icon: "mdi:battery"
    state_class: measurement
    device_class: battery
    accuracy_decimals: 0
    filters:
      - lambda: 'return id(battery_2_present).state ? x : NAN;'

  - platform: ble_client
    ble_client_id: my_ble_device
    type: characteristic
    name: "Battery 2 Cycles"
    service_uuid: "9a5900e0-6e67-5d0d-aab9-ad9126b66f91"
    characteristic_uuid: "9a5900f2-6e67-5d0d-aab9-ad9126b66f91"
    id: bat2_cycles
    icon: "mdi:battery-sync"
    entity_category: diagnostic
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 600s
    filters:
      - lambda: 'return id(battery_2_present).state ? x : NAN;'

  # Battery 2 Present → internal, exposed as binary_sensor
  - platform: ble_client
    ble_client_id: my_ble_device
    type: characteristic
    id: battery_2_present_raw
    internal: true
    name: "Battery 2 Present"
    service_uuid: "9a5900e0-6e67-5d0d-aab9-ad9126b66f91"
    characteristic_uuid: "9a5900ef-6e67-5d0d-aab9-ad9126b66f91"
    icon: "mdi:battery-check"
    entity_category: diagnostic
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) return;   // ignore the NaN published on disconnect
            id(battery_2_present).publish_state(x != 0);

  # --- Aux Battery Service (0x9a590040) ---
  - platform: ble_client
    ble_client_id: my_ble_device
    type: characteristic
    name: "Aux Battery Voltage"
    service_uuid: "9a590040-6e67-5d0d-aab9-ad9126b66f91"
    characteristic_uuid: "9a590041-6e67-5d0d-aab9-ad9126b66f91"
    id: aux_voltage
    unit_of_measurement: "V"
    icon: "mdi:lightning-bolt"
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 2
    lambda: |-
      if (x.size() >= 2) {
        uint16_t mv = (uint16_t)x[0] | ((uint16_t)x[1] << 8);
        return (float)mv / 1000.0f;
      }
      return 0.0f;

  - platform: ble_client
    ble_client_id: my_ble_device
    type: characteristic
    name: "Aux Battery Level"
    service_uuid: "9a590040-6e67-5d0d-aab9-ad9126b66f91"
    characteristic_uuid: "9a590044-6e67-5d0d-aab9-ad9126b66f91"
    id: aux_level
    unit_of_measurement: "%"
    icon: "mdi:battery"
    accuracy_decimals: 0
    device_class: battery
    entity_category: diagnostic

  # --- CBB Connectivity Battery (0x9a590060) ---
  - platform: ble_client
    ble_client_id: my_ble_device
    type: characteristic
    name: "CBB Battery Level"
    service_uuid: "9a590060-6e67-5d0d-aab9-ad9126b66f91"
    characteristic_uuid: "9a590061-6e67-5d0d-aab9-ad9126b66f91"
    id: cbb_level
    unit_of_measurement: "%"
    icon: "mdi:battery-bluetooth"
    accuracy_decimals: 0
    device_class: battery
    entity_category: diagnostic

  # CBB capacity/voltage. All three are little-endian uint32:
  # 9a590063/64 in µAh (→ Ah), 9a590065 in µV (→ V).
  - platform: ble_client
    ble_client_id: my_ble_device
    type: characteristic
    name: "CBB Remaining Capacity"
    service_uuid: "9a590060-6e67-5d0d-aab9-ad9126b66f91"
    characteristic_uuid: "9a590063-6e67-5d0d-aab9-ad9126b66f91"
    id: cbb_remaining
    unit_of_measurement: "Ah"
    icon: "mdi:battery-70"
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 3
    update_interval: 600s
    lambda: |-
      if (x.size() >= 4) {
        uint32_t uah = (uint32_t)x[0] | ((uint32_t)x[1] << 8) | ((uint32_t)x[2] << 16) | ((uint32_t)x[3] << 24);
        return (float)uah / 1000000.0f;
      }
      return NAN;

  - platform: ble_client
    ble_client_id: my_ble_device
    type: characteristic
    name: "CBB Full Capacity"
    service_uuid: "9a590060-6e67-5d0d-aab9-ad9126b66f91"
    characteristic_uuid: "9a590064-6e67-5d0d-aab9-ad9126b66f91"
    id: cbb_full
    unit_of_measurement: "Ah"
    icon: "mdi:battery"
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 3
    update_interval: 600s
    lambda: |-
      if (x.size() >= 4) {
        uint32_t uah = (uint32_t)x[0] | ((uint32_t)x[1] << 8) | ((uint32_t)x[2] << 16) | ((uint32_t)x[3] << 24);
        return (float)uah / 1000000.0f;
      }
      return NAN;

  - platform: ble_client
    ble_client_id: my_ble_device
    type: characteristic
    name: "CBB Cell Voltage"
    service_uuid: "9a590060-6e67-5d0d-aab9-ad9126b66f91"
    characteristic_uuid: "9a590065-6e67-5d0d-aab9-ad9126b66f91"
    id: cbb_cell
    unit_of_measurement: "V"
    icon: "mdi:sine-wave"
    device_class: voltage
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 3
    update_interval: 120s
    lambda: |-
      if (x.size() >= 4) {
        uint32_t uv = (uint32_t)x[0] | ((uint32_t)x[1] << 8) | ((uint32_t)x[2] << 16) | ((uint32_t)x[3] << 24);
        return (float)uv / 1000000.0f;
      }
      return NAN;

  # OTA_STATUS (9a590503) notifications. Publishes a human-readable summary to the
  # "OTA Status" text sensor; the raw hex is logged (ESP log only, tag "ota").
  # Protocol: https://reference.librescoot.org/dev/bluetooth/ota-transfer/
  - platform: ble_client
    ble_client_id: my_ble_device
    type: characteristic
    id: ota_status_raw
    internal: true
    service_uuid: "9a590500-6e67-5d0d-aab9-ad9126b66f91"
    characteristic_uuid: "9a590503-6e67-5d0d-aab9-ad9126b66f91"
    notify: true
    update_interval: never
    lambda: |-
      // Raw hex → ESP log only.
      std::string h; char b[4];
      for (auto v : x) { snprintf(b, sizeof(b), "%02X ", v); h += b; }
      ESP_LOGD("ota", "OTA_STATUS raw: %s", h.c_str());

      // Human-readable summary → entity.
      std::string s = "unknown";
      if (!x.empty()) {
        uint8_t op = x[0];
        if (op == 0x84 && x.size() >= 3) {                 // INSTALL_PROGRESS
          const char *ph = "?";
          switch (x[1]) {
            case 0x00: ph = "Verifying";      break;
            case 0x01: ph = "Installing";     break;
            case 0x02: ph = "Pending reboot"; break;
            case 0x03: ph = "Rebooting";      break;
            case 0x04: ph = "Success";        break;
            case 0x05: ph = "Failed";         break;
            case 0x06: ph = "Idle";           break;
          }
          s = ph;
          if (x[1] == 0x01) { char p[8]; snprintf(p, sizeof(p), " %u%%", x[2]); s += p; }
          if (x.size() >= 4 && x[3] > 0 && x.size() >= (size_t)(4 + x[3])) {
            s += ": "; s.append((const char *) &x[4], x[3]);
          }
        } else if (op == 0x81 && x.size() >= 2) {          // START_ACK
          const char *st = "?";
          switch (x[1]) {
            case 0x00: st = "resuming";            break;
            case 0x01: st = "fresh transfer";      break;
            case 0x10: st = "no staging space";    break;
            case 0x11: st = "busy";                break;
            case 0x12: st = "bad parameters";      break;
            case 0x13: st = "install in progress"; break;
          }
          s = std::string("Start ack: ") + st;
        } else if (op == 0x82 && x.size() >= 6) {          // ACK
          uint32_t a = (uint32_t)x[2] | ((uint32_t)x[3]<<8) | ((uint32_t)x[4]<<16) | ((uint32_t)x[5]<<24);
          char buf[48]; snprintf(buf, sizeof(buf), "Ack %u bytes%s", (unsigned)a, (x[1]&0x01)?" (rewind)":"");
          s = buf;
        } else if (op == 0x83 && x.size() >= 2) {          // COMPLETE_ACK
          const char *st = "?";
          switch (x[1]) {
            case 0x00: st = "verified, queued"; break;
            case 0x01: st = "SHA-256 mismatch"; break;
            case 0x02: st = "size mismatch";    break;
            case 0x03: st = "queueing failed";  break;
          }
          s = std::string("Complete: ") + st;
        } else if (op == 0x85) {                           // ABORT_ACK
          s = "Aborted";
        } else if (op == 0x86 && x.size() >= 2) {          // ERROR
          const char *c = "?";
          switch (x[1]) {
            case 0x01: c = "iMX suspended";        break;
            case 0x02: c = "USOCK overflow";       break;
            case 0x03: c = "internal error";       break;
            case 0x04: c = "staging write failed"; break;
            case 0x05: c = "no staging space";     break;
            case 0x06: c = "no active session";    break;
          }
          s = std::string("Error: ") + c;
          if (x.size() >= 3 && x[2] > 0 && x.size() >= (size_t)(3 + x[2])) {
            s += " - "; s.append((const char *) &x[3], x[2]);
          }
        }
      }
      id(ota_status_txt).publish_state(s);

      // Track whether a transfer/install is active; force the BLE link up while it is.
      bool active = false;
      if (!x.empty()) {
        uint8_t o = x[0];
        if (o == 0x81 && x.size() >= 2) active = (x[1] == 0x00 || x[1] == 0x01);  // START_ACK ok
        else if (o == 0x82) active = true;                                        // ACK (transferring)
        else if (o == 0x83 && x.size() >= 2) active = (x[1] == 0x00);             // COMPLETE_ACK queued
        else if (o == 0x84 && x.size() >= 2) active = (x[1] <= 0x03);             // verifying..rebooting
      }
      if (active != id(ota_active)) {
        id(ota_active) = active;
        id(apply_link_state).execute();
      }
      return (float)x.size();


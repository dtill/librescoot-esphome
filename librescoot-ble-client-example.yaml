# Unu-Scooter Pro BLE interface for Librescoot FW and nRF >v2.0.0-ls
#
# Component edition: the librescoot_ble_client external component owns the BLE client and
# implements every characteristic parser, the passkey pairing flow, the extended-command
# engine and the OTA diagnostics in C++. This YAML only names the entities it wants.
#
# secrets.yaml keys used below:
#   librescoot_wifi_ssid / _pw, librescoot_fallback_ap_pw,
#   librescoot_webserver_basic_auth_user / _pw, librescoot_nrf_ble_mac_addr

substitutions:
  device_name: "librescoot-component-485934"   # hostname, must be <=31 chars
  device_friendly_name: "Librescoot-BLE-Client-component-485934"
  device_id_name: "librescoot_nrf_component_485934"
  ble_mac: !secret librescoot_nrf_ble_mac_addr

esphome:
  name: $device_name
  friendly_name: $device_friendly_name
  comment: "Connects to the LibreScoot / unu Scooter Pro firmware through the nRF BLE chip and controls the most common phone-app functions and a little more."
  build_path: "../config/esphome/build/${device_name}_build"
  # Advertised in the mDNS TXT record so the Librescoot-BLE-Client HA integration can
  # zeroconf-discover this device (and only this kind of device).
  project:
    name: "librescoot.ble_client"
    version: "1.0.0"

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: false   # SRAM1 -> DRAM heap (~+40 kB) so the RSA-4096 CDN TLS handshake fits
    sdkconfig_options:
      # The OTA update check pins only the two GitHub root CAs in the component
      # (github_ca.h), so the ~100 kB Mozilla cert bundle is not compiled in.
      CONFIG_MBEDTLS_CERTIFICATE_BUNDLE: n
      # Shrink the TLS heap footprint so the handshake still fits alongside BLE + the OTA
      # ring buffer on the ESP32-classic (no PSRAM). Only small requests are sent.
      CONFIG_MBEDTLS_DYNAMIC_BUFFER: y
      CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN: "4096"
      CONFIG_MBEDTLS_ASYMMETRIC_CONTENT_LEN: y

external_components:
  - source:
      type: git
      url: https://github.com/dtill/librescoot-esphome
    components: [librescoot_ble_client]
    refresh: 0s

api:
  reboot_timeout: 5min
  encryption:
    key: !secret librescoot_api_key
  actions:
    # Pairing: the scooter shows a 6-digit passkey on its dashboard; reply with it here.
    - action: passkey_reply
      variables:
        pin: int
      then:
        - librescoot_ble_client.passkey_reply:
            id: librescoot_ble_client_hub
            passkey: !lambda "return pin;"
    # Test hook for the OTA transfer engine (stage-only by default; nothing is installed).
    - action: ota_test
      variables:
        url: string
        size: int
        bundle: string
        component: int
      then:
        - librescoot_ble_client.ota_transfer:
            id: librescoot_ble_client_hub
            url: !lambda "return url;"
            size: !lambda "return size;"
            bundle_id: !lambda "return bundle;"
            component: !lambda "return component;"
    - action: ota_abort
      then:
        - librescoot_ble_client.ota_abort:
            id: librescoot_ble_client_hub

ota:
  platform: esphome
  password: !secret librescoot_ota_pw

wifi:
  use_address: 192.168.178.171
  ssid: !secret librescoot_wifi_ssid
  password: !secret librescoot_wifi_pw
  reboot_timeout: 1min
  min_auth_mode: WPA2
  ap:
    ssid: ${device_name}-ap
    password: !secret librescoot_fallback_ap_pw

captive_portal:

web_server:
  local: true
  version: 3
  port: 80
  auth:
    username: !secret librescoot_webserver_basic_auth_user
    password: !secret librescoot_webserver_basic_auth_pw
    type: digest

logger:
  baud_rate: 0

# --- BLE stack plumbing (shared, stack-level; must stay in the YAML) ---
esp32_ble:
  io_capability: keyboard_only   # required for the scooter's passkey pairing
esp32_ble_tracker:

# Time source for the clock-set entities (System Time sync / UTC ISO-8601).
time:
  - platform: sntp
    id: sntp_time
    servers:
      - 192.168.178.1
      - pool.ntp.org

# -----------------------------------------------------------------------------
# LSC Bluetooth nRF component — every scooter entity, opt-in by name.
# -----------------------------------------------------------------------------
librescoot_ble_client:
  id: librescoot_ble_client_hub
  mac_address: ${ble_mac}
  time_id: sntp_time
  # --- OTA settings ---------------------------------------------------------
  # Autonomous, no Home Assistant relay: the S3 has the PSRAM headroom to do the RSA-4096 CDN
  # TLS handshake, so it downloads firmware straight from GitHub. use_cert_bundle validates
  # api.github.com + objects.githubusercontent.com against the Mozilla roots (auto-enables the
  # CONFIG_MBEDTLS_CERTIFICATE_BUNDLE sdkconfig) — no pinned cert baked into the component.
  use_cert_bundle: true
  # Test board: stop every transfer before COMPLETE, so nothing is actually installed. Flip to
  # false for a real install.
  stage_only: false
  # ca_certificate: |                      # alternative to the bundle: explicit PEM root(s)
  #   -----BEGIN CERTIFICATE----- ...
  # firmware_source: "http://192.168.178.71:8000"   # compile-time default byte source (mirror)
  # github_repo: "librescoot/librescoot"   # owner/name the firmware releases come from
  # update_check_interval: 6h              # how often to poll GitHub for a newer release

  # ----- Telemetry (read) ----------------------------------------------------
  status:
    name: "Status"
  seatbox:
    name: "Seatbox"
  handlebar_lock:
    name: "Handlebar Lock"
  power_state:
    name: "Power State"
  power_mux:
    name: "MDB Power Mux Selected Input"
  odometer:
    name: "Odometer"

  battery_1_soc:
    name: "Battery 1 SoC"
  battery_1_cycles:
    name: "Battery 1 Cycles"
  battery_1_state:
    name: "Battery 1 State"
  battery_1_present:
    name: "Battery 1 Present"
  battery_2_soc:
    name: "Battery 2 SoC"
  battery_2_cycles:
    name: "Battery 2 Cycles"
  battery_2_state:
    name: "Battery 2 State"
  battery_2_present:
    name: "Battery 2 Present"

  aux_voltage:
    name: "Aux Battery Voltage"
  aux_level:
    name: "Aux Battery Level"
  aux_charge_status:
    name: "Aux Charge Status"

  cbb_level:
    name: "CBB Battery Level"
  cbb_charge_status:
    name: "CBB Charge Status"
  cbb_remaining:
    name: "CBB Remaining Capacity"
  cbb_full:
    name: "CBB Full Capacity"
  cbb_cell:
    name: "CBB Cell Voltage"

  navigation_active:
    name: "Navigation Active"
  ums_status:
    name: "UMS Status"
  maps_available:
    name: "Maps Available"
  navigation_available:
    name: "Navigation Available"
  keycard_count:
    name: "Keycard Count"

  # ----- Versions ------------------------------------------------------------
  sw_mdb:
    name: "SW MDB"
  sw_nrf:
    name: "SW nRF"
  sw_dbc:
    name: "SW DBC"
  sw_esp:
    name: "SW ESP"

  # ----- BLE link ------------------------------------------------------------
  ble_connection:
    name: "BLE Connection"
  ble_presence:
    name: "BLE Presence"
  # Problem sensor (device_class: problem — shows red/"Detected" in HA). ON while the scooter is
  # asking for the pairing passkey; enter it with the passkey_reply action (or, with the HA
  # integration, its Repair dialog). Turns OFF once bonding succeeds.
  passkey_required:
    name: "Passkey Required"
  # Problem sensor (device_class: problem). ON only when the configured scooter is in range
  # (advertising) but not bonded — i.e. an unrequested (re)pair was refused because the bond was
  # lost. Never fires just because the scooter is away or momentarily disconnected. The HA
  # integration turns this into a Repair that starts the pairing flow. Clears on bond / out of range.
  pairing_required:
    name: "Pairing Required"
  # Problem sensor (device_class: problem). ON when the scooter has sat in "pending reboot" for
  # >20 min — a firmware install finished but the reboot that applies it hasn't happened (or the
  # BLE status latched stale). Press "Reboot MDB" to clear it (the HA integration offers this as a
  # Repair). Turns OFF as soon as the scooter leaves pending-reboot.
  reboot_required:
    name: "Reboot Required"
  rssi:
    name: "BLE RSSI"
  ble_link_mode:
    name: "BLE Link Mode"
  # The scooter MAC this ESP is configured for (its `mac_address`), always shown — the HA
  # integration reads it to preselect/show the connected scooter without scanning.
  scooter_mac:
    name: "Scooter MAC"
  # On = the Home Assistant "Librescoot-BLE-Client" integration is active — the component pings
  # its plain-HTTP OTA relay. Drives whether OTA is possible (else the ESP needs direct-GitHub).
  ha_integration:
    name: "HA Integration"

  # ----- Lock & controls -----------------------------------------------------
  scooter_lock:
    name: "Scooter Lock"
  blinker:
    name: "Blinker"
  usb_mode:
    name: "USB Mode"
  seatbox_open:
    name: "Seatbox Open"
  hibernate:
    name: "Hibernate"
  wakeup:
    name: "Wakeup"
  reboot_mdb:
    name: "Reboot MDB"
  reboot_mdb_hard:
    name: "Reboot MDB (hard)"

  # ----- Alarm & navigation --------------------------------------------------
  alarm_enabled:
    name: "Alarm Enabled"
  alarm_armed:
    name: "Alarm Armed"
  alarm_start:
    name: "Alarm Start"
  alarm_stop:
    name: "Alarm Stop"
  navigation_set:
    name: "Navigation Set to"
  navigation_clear:
    name: "Navigation Clear"
  cancel_hibernate:
    name: "Cancel Hibernate"

  # ----- Configuration -------------------------------------------------------
  cellular_apn:
    name: "Cellular APN"
  pm_scheduled_hibernate_enabled:
    name: "PM Scheduled Hibernation Enabled"
  pm_scheduled_hibernate_cron:
    name: "PM Scheduled Hibernation Cron"
  pm_scheduled_hibernate_duration:
    name: "PM Scheduled Hibernation Duration"
  ota_channel:
    name: "OTA channel"
  # Transfer method for the next install: "delta" (small patch, default) or "full"
  # (complete .mender image, hundreds of MB — an overnight transfer on this hardware).
  ota_update_method:
    name: "OTA Update Method"
  # OTA byte source: "direct GitHub" (this ESP fetches from GitHub itself) or "HA relay" (Home
  # Assistant serves the bytes). Default is chip-based (this S3 → direct GitHub); persisted in NVS.
  ota_source:
    name: "OTA Source"

  # ----- System, time & diagnostics ------------------------------------------
  system_time_sync:
    name: "System Time sync with ESP"
  system_time_iso:
    name: "System Time Set UTC ISO-8601"
  refresh:
    name: "A-Refresh Sensor States"
  ble_remove_bond:
    name: "BLE Remove Bond"
    disabled_by_default: true
  # Explicitly (re)bond with the scooter. The ESP NEVER pairs on its own — a lost/stale bond just
  # releases the link; press this (or use the HA pairing Repair) to bond intentionally.
  pair_scooter:
    name: "Pair Scooter"
  restart_esp:
    name: "Restart ESPHome Device"

  # ----- Extended command ----------------------------------------------------
  command:
    name: "Command"
  command_response:
    name: "Command response"
  command_last_response:
    name: "Command last response"

  # ----- OTA diagnostics -----------------------------------------------------
  ota_status:
    name: "OTA Status"
  # Estimated time remaining for the running transfer, HH:MM:SS (updated on the throttled
  # status cadence: every 5 s, or 60 s / 5 min for larger bundles).
  ota_eta:
    name: "OTA Upload ETA"
  ota_status_request:
    name: "OTA Status Request"
  ota_abort:
    name: "OTA Abort"

  # ----- Firmware update — one entity per board (they install sequentially: the scooter
  # reboots after each component). DBC only shows "available" once MDB is already at the
  # latest and DBC is behind; the manual Install buttons below always work. ------
  mdb_update:
    name: "OTA MDB Update"
  dbc_update:
    name: "OTA DBC Update"
  # Byte source for the transfer. Default = GitHub; point at a local HTTP mirror
  # (e.g. http://192.168.178.71:8000) to drop TLS from the bulk download. Files served at
  # <base>/<tag>/<asset-name>. Metadata (size/SHA) always comes from the GitHub API.
  ota_source_url:
    name: "OTA Source URL"
  # Manual per-board install (always available). Target = OTA Version if set, else: MDB = the
  # channel latest, DBC = the MDB's current version (bring DBC up to match the board).
  ota_mdb_update:
    name: "OTA MDB Install"
  ota_dbc_update:
    name: "OTA DBC Install"
  # Optional specific release tag to install (e.g. nightly-20260724T040816). Leave empty to
  # use the latest release for the selected channel.
  ota_version:
    name: "OTA Version"

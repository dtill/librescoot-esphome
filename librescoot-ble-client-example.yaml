# Unu Scooter Pro BLE interface for LibreScoot firmware (nRF v2.x-ls)
#
# The librescoot_ble_client external component owns the BLE client: every characteristic
# parser, the passkey pairing flow, the extended-command engine, the alarm and dashboard
# entities and the firmware-update engine live in C++. This YAML names the hardware, the
# network, and the entities it wants — nothing else.
#
# Works unchanged on an ESP32 classic and on an ESP32-S3 with PSRAM: the component sets the
# board-specific sdkconfig (BLE, Wi-Fi/LwIP buffers, TLS, PSRAM fallback) itself. The only
# board-specific lines are in the `esp32:` / `psram:` section below.
#
# secrets.yaml keys used below:
#   librescoot_nrf_ble_mac_addr, librescoot_api_key,
#   librescoot_wifi_ssid / _pw, librescoot_fallback_ap_pw,
#   librescoot_webserver_basic_auth_user / _pw (only with web_server),
#   librescoot_github_token (optional)

substitutions:
  device_name: "librescoot-ble-client"        # hostname, must be <= 31 chars
  device_friendly_name: "Librescoot-BLE-Client"
  ble_mac: !secret librescoot_nrf_ble_mac_addr

esphome:
  name: $device_name
  friendly_name: $device_friendly_name
  comment: "Connects to the LibreScoot / unu Scooter Pro firmware through the nRF BLE chip and controls the most common phone-app functions and a little more."
  # Advertised in the mDNS TXT record so the Librescoot-BLE-Client Home Assistant integration
  # can discover this device (and only this kind of device).
  project:
    name: "librescoot.ble_client"
    version: "1.0.0"

# ----- Board: pick ONE of the two blocks --------------------------------------------------
# ESP32 classic (no PSRAM). Firmware bytes come through the Home Assistant integration's relay.
esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"

# ESP32-S3 with PSRAM (e.g. N16R8). Downloads firmware straight from GitHub, no relay needed.
# esp32:
#   board: esp32-s3-devkitc-1
#   flash_size: 16MB
#   framework:
#     type: esp-idf
# psram:
#   mode: octal
#   speed: 80MHz
# --------------------------------------------------------------------------------------------

external_components:
  - source:
      type: git
      url: https://github.com/dtill/librescoot-esphome
    components: [librescoot_ble_client]
    refresh: 0s

api:
  reboot_timeout: 5min
  encryption:
    key: !secret librescoot_api_key
  # No `actions:` needed: the component registers its services (passkey_reply, ota_test,
  # ota_abort) itself, and every function is also an entity.

ota:
  - platform: esphome
    encryption:          # reuses the API key (ESPHome 2026.9 or newer)

wifi:
  ssid: !secret librescoot_wifi_ssid
  password: !secret librescoot_wifi_pw
  reboot_timeout: 1min
  min_auth_mode: WPA2
  # use_address: 192.168.1.50   # set if mDNS (${device_name}.local) is flaky on your network
  ap:
    ssid: ${device_name}-ap
    password: !secret librescoot_fallback_ap_pw

captive_portal:

# Optional. Leave it out on an ESP32 classic: its task and buffers come out of the same
# internal RAM a firmware transfer needs, and Home Assistant shows everything it would.
# web_server:
#   local: true
#   version: 3
#   port: 80
#   auth:
#     username: !secret librescoot_webserver_basic_auth_user
#     password: !secret librescoot_webserver_basic_auth_pw
#     type: digest

logger:
  baud_rate: 0

# --- BLE stack (stack-level; stays in the YAML). The component applies the passkey pairing
# capability and, without PSRAM, trims the connection slots to what is registered. ---
esp32_ble:
esp32_ble_tracker:

# Time source for the clock-set entities (System Time sync / UTC ISO-8601).
time:
  - platform: sntp
    id: sntp_time

# -----------------------------------------------------------------------------
# LSC Bluetooth nRF component — every scooter entity, opt-in by name.
# -----------------------------------------------------------------------------
librescoot_ble_client:
  id: librescoot_ble_client_hub
  mac_address: ${ble_mac}
  time_id: sntp_time
  # "auto" link mode: hold the scooter's single BLE connection this long, then drop it for ~20 s
  # so a phone or another client gets a turn. 0s = never yield on purpose. Raise it to cut
  # reconnect churn at the edge of range.
  link_auto_hold: 3min
  # After a DBC (dashboard) update has been installed, switch the dashboard on so the update
  # applies and the new version is read — no ride needed. Needs nRF v2.11.0-ls or newer.
  dbc_auto_power: false
  # --- OTA settings (defaults shown; the component picks the byte source and the TLS roots
  #     by board: with PSRAM straight from GitHub against the Mozilla bundle, without PSRAM
  #     via the Home Assistant relay with the GitHub roots pinned) ---
  # github_repo: "librescoot/librescoot"   # owner/name the firmware releases come from
  # update_check_interval: 6h              # how often to poll GitHub for a newer release
  # use_cert_bundle: true                  # force the Mozilla bundle (default = PSRAM present)
  # ca_certificate: |                      # or an explicit PEM root instead of the bundle
  #   -----BEGIN CERTIFICATE----- ...
  # firmware_source: "http://192.168.178.71:8000"   # compile-time default byte source (mirror)
  # ota_source_default: relay              # override the chip-based default (github / relay)
  # Optional fine-grained GitHub token (public repo, read-only): raises the API limit from 60 to
  # 5000 requests/hour. Sent to api.github.com only, never on the asset download.
  # github_token: !secret librescoot_github_token

  # ----- Telemetry (read) ----------------------------------------------------
  status:
    name: "Status"
  seatbox:
    name: "Seatbox"
  handlebar_lock:
    name: "Handlebar Lock"
  power_state:
    name: "Power State"
  power_mux:
    name: "MDB Power Mux Selected Input"
  odometer:
    name: "Odometer"

  battery_1_soc:
    name: "Battery 1 SoC"
  battery_1_cycles:
    name: "Battery 1 Cycles"
  battery_1_state:
    name: "Battery 1 State"
  battery_1_present:
    name: "Battery 1 Present"
  battery_2_soc:
    name: "Battery 2 SoC"
  battery_2_cycles:
    name: "Battery 2 Cycles"
  battery_2_state:
    name: "Battery 2 State"
  battery_2_present:
    name: "Battery 2 Present"

  aux_voltage:
    name: "Aux Battery Voltage"
  aux_level:
    name: "Aux Battery Level"
  aux_charge_status:
    name: "Aux Charge Status"

  cbb_level:
    name: "CBB Battery Level"
  cbb_charge_status:
    name: "CBB Charge Status"
  cbb_remaining:
    name: "CBB Remaining Capacity"
  cbb_full:
    name: "CBB Full Capacity"
  cbb_cell:
    name: "CBB Cell Voltage"

  navigation_active:
    name: "Navigation Active"
  # LTC4020 aux charger state, read with the "ltc:status" extended command on connect
  # (its GATT service 9a590120 is not exposed by the current firmware).
  aux_charger:
    name: "Aux Charger"
  ums_status:
    name: "MDB UMS Status"
  maps_available:
    name: "Navigation Maps Available"
  navigation_available:
    name: "Navigation Available"
  keycard_count:
    name: "Keycard Count"

  # ----- Versions ------------------------------------------------------------
  sw_mdb:
    name: "SW MDB"
  sw_nrf:
    name: "SW nRF"
  sw_dbc:
    name: "SW DBC"
  sw_esp:
    name: "SW ESP"

  # ----- BLE link ------------------------------------------------------------
  ble_connection:
    name: "BLE Connection"
  ble_presence:
    name: "BLE Presence"
  # Problem sensor (device_class: problem — shows red/"Detected" in HA). ON while the scooter is
  # asking for the pairing passkey; enter it with 'BLE Pairing Passkey' + 'BLE Pairing Send
  # Passkey' (or, with the HA integration, its Repair dialog). Turns OFF once bonding succeeds.
  passkey_required:
    name: "BLE Passkey Required"
  # Problem sensor (device_class: problem). ON only when the configured scooter is in range
  # (advertising) but not bonded — i.e. an unrequested (re)pair was refused because the bond was
  # lost. Never fires just because the scooter is away or momentarily disconnected. The HA
  # integration turns this into a Repair that starts the pairing flow. Clears on bond / out of range.
  pairing_required:
    name: "BLE Pairing Required"
  # Problem sensor (device_class: problem). ON when the scooter has sat in "pending reboot" for
  # >20 min — a firmware install finished but the reboot that applies it hasn't happened (or the
  # BLE status latched stale). Press "Reboot MDB" to clear it (the HA integration offers this as a
  # Repair). Turns OFF as soon as the scooter leaves pending-reboot.
  reboot_required:
    name: "OTA Reboot Required"
  rssi:
    name: "BLE RSSI"
  ble_link_mode:
    name: "BLE Link Mode"
  # The scooter MAC this ESP is configured for (its `mac_address`), always shown — the HA
  # integration reads it to preselect/show the connected scooter without scanning.
  scooter_mac:
    name: "BLE Scooter nRF MAC"
  # On = the Home Assistant "Librescoot-BLE-Client" integration is active — the component pings
  # its plain-HTTP OTA relay. Drives whether OTA is possible (else the ESP needs direct-GitHub).
  ha_integration:
    name: "OTA Source HA Relay"

  # ----- Lock & controls -----------------------------------------------------
  scooter_lock:
    name: "Scooter Lock"
  blinker:
    name: "Blinker"
  usb_mode:
    name: "MDB USB Mode"
  seatbox_open:
    name: "Seatbox Open"
  hibernate:
    name: "Hibernate"
  wakeup:
    name: "Wakeup"
  reboot_mdb:
    name: "Reboot MDB"
  reboot_mdb_hard:
    name: "Reboot MDB (hard)"

  # ----- Alarm & navigation --------------------------------------------------
  # Reflects the scooter's real alarm.enabled setting (read on connect and after each toggle).
  alarm_enabled:
    name: "Alarm Enabled"
  # Alarm service (9a590220, nRF >= v2.11.0-ls). Armed state reflected from the scooter; the
  # trigger event fires once per trigger, also for one that happened while the link was down.
  alarm_armed:
    name: "Alarm Armed"
  alarm_status:
    name: "Alarm Status"
  alarm_triggered:
    name: "Alarm Triggered"
  alarm_last_trigger:
    name: "Alarm Last Trigger"
  alarm_last_trigger_time:
    name: "Alarm Last Trigger Time"
  alarm_trigger:
    name: "Alarm Trigger"
  # Dashboard power (dbc:*, nRF >= v2.11.0-ls). Does not change the vehicle state.
  dbc_power:
    name: "DBC Power"
  dbc_ready:
    name: "DBC Ready"
  # OTA control switches (always start OFF each boot; no scooter write).
  # OTA Stage Only: transfers run fully but stop before COMPLETE (staging test, nothing installed).
  ota_stage_only:
    name: "OTA Stage Only"
  # OTA Auto Update: install every offered update unattended (delta = next release, DBC-first; full =
  # latest, MDB-first), waiting out each reboot, then switch itself off when everything is up to date.
  ota_auto_update:
    name: "OTA Auto Update"
  # Merge a run of consecutive deltas into one artifact, so a scooter several releases behind needs
  # one install and one reboot instead of several. The merge runs on the Home Assistant relay, so
  # this only takes effect with OTA Update Method "delta" and a reachable relay; the switch refuses
  # to turn on otherwise. It does not save bytes - a merged patch is usually larger than the steps
  # it replaces.
  ota_delta_chaining:
    name: "OTA Update Method delta-chaining"
  # Arm/disarm buttons: kept for firmware without the alarm service (the switch above needs it).
  alarm_arm:
    name: "Alarm Arm"
  alarm_disarm:
    name: "Alarm Disarm"
  alarm_start:
    name: "Alarm Start"
  alarm_stop:
    name: "Alarm Stop"
  navigation_set:
    name: "Navigation Set to"
  navigation_clear:
    name: "Navigation Clear"
  cancel_hibernate:
    name: "Cancel Hibernate"

  # ----- Configuration -------------------------------------------------------
  cellular_apn:
    name: "Cellular APN"
  pm_scheduled_hibernate_enabled:
    name: "PM Scheduled Hibernation Enabled"
  pm_scheduled_hibernate_cron:
    name: "PM Scheduled Hibernation Cron"
  pm_scheduled_hibernate_duration:
    name: "PM Scheduled Hibernation Duration"
  ota_channel:
    name: "OTA channel"
  # Transfer method for the next install: "delta" (small patch, default) or "full"
  # (complete .mender image, hundreds of MB — an overnight transfer on this hardware).
  ota_update_method:
    name: "OTA Update Method"
  # OTA byte source: "direct GitHub" (this ESP fetches from GitHub itself) or "HA relay" (Home
  # Assistant serves the bytes). Default is chip-based (this S3 → direct GitHub); persisted in NVS.
  ota_source:
    name: "OTA Source"

  # ----- System, time & diagnostics ------------------------------------------
  system_time_sync:
    name: "System Time sync with ESP"
  system_time_iso:
    name: "System Time Set UTC ISO-8601"
  refresh:
    name: "A-Refresh Sensor States"
  ble_remove_bond:
    name: "BLE Pairing Delete"
    disabled_by_default: true
  # Explicitly (re)bond with the scooter. The ESP NEVER pairs on its own — a lost/stale bond just
  # releases the link; press this (or use the HA pairing Repair) to bond intentionally.
  pair_scooter:
    name: "BLE Pairing Start"
  restart_esp:
    name: "Restart ESPHome Device"

  # ----- Extended command ----------------------------------------------------
  command:
    name: "Command"
  command_response:
    name: "Command response"
  command_last_response:
    name: "Command last response"

  # ----- OTA diagnostics -----------------------------------------------------
  ota_status:
    name: "OTA Status"
  # Estimated time remaining for the running transfer, HH:MM:SS (updated on the throttled
  # status cadence: every 5 s, or 60 s / 5 min for larger bundles).
  ota_eta:
    name: "OTA Upload ETA"
  # Live throughput/byte sensors measured from the transfer itself (not the scooter's OTA_STATUS).
  # The two speeds publish every 10 s while a transfer runs, and park at 0 when it ends.
  ota_download_speed:
    name: "OTA Speed Download"
  ota_ble_upload_speed:
    name: "OTA Speed BLE Upload"
  ota_ble_bytes_total:
    name: "OTA BLE Bytes Total"
  ota_target_transferred:
    name: "OTA Target Transferred"
  # Self-heal: how often a transfer-phase failure auto-resumed instead of aborting the update.
  ota_auto_resume_count:
    name: "OTA Auto-Resume Count"
  ota_status_request:
    name: "OTA Status Request"
  ota_abort:
    name: "OTA Abort"

  # ----- Firmware update — one entity per board (they install sequentially: the scooter
  # reboots after each component). DBC only shows "available" once MDB is already at the
  # latest and DBC is behind; the manual Install buttons below always work. ------
  mdb_update:
    name: "OTA MDB Update"
  dbc_update:
    name: "OTA DBC Update"
  # Byte source for the transfer. Default = GitHub; point at a local HTTP mirror
  # (e.g. http://192.168.178.71:8000) to drop TLS from the bulk download. Files served at
  # <base>/<tag>/<asset-name>. Metadata (size/SHA) always comes from the GitHub API.
  ota_source_url:
    name: "OTA Source URL"
  # Manual per-board install (always available). Target = OTA Version if set, else: MDB = the
  # channel latest, DBC = the MDB's current version (bring DBC up to match the board).
  ota_mdb_update:
    name: "OTA MDB Install"
  ota_dbc_update:
    name: "OTA DBC Install"
  # Optional specific release tag to install (e.g. nightly-20260724T040816). Leave empty to
  # use the latest release for the selected channel.
  # Pairing: type the 6-digit code from the scooter dashboard here and submit.
  ble_passkey:
    name: "BLE Pairing Passkey"
  ble_send_code:
    name: "BLE Pairing Send Passkey"
  ota_version:
    name: "OTA Version"
